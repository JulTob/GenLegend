# The README's two rites, run by GitHub instead of by hand.
#
#   Prove     every pull request, and every push to main
#   Publish   main only, and only after Prove is green
#
# Publishing is outward-facing, and QST-0093.8 records that the word is
# Julio's: "the first deploy is on Julio's word". So Publish is bound to the
# `production` Environment, and GitHub holds the job there until a reviewer
# approves it. Delete the `environment:` block to let main publish by itself.
#
# No key is stored anywhere. `id-token: write` lets this workflow prove to
# Google who it is (Workload Identity Federation), and Google answers with a
# short-lived token. Nothing long-lived lives in the repository.

name: Prove and Publish

on:
  pull_request:
  push:
    branches:
      - main
  # The button. Actions tab -> Prove and Publish -> Run workflow, with main
  # selected. Publishing still needs main, so choosing another branch there
  # proves it and publishes nothing, which is the safe way round.
  workflow_dispatch:

# One run per branch. A newer push cancels an older run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:

  prove:
    name: Prove
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Take the code
        uses: actions/checkout@v4

      - name: Take the Python the container runs
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Build the venv
        run: make setup

      # The same three rites a contributor runs, by the same commands, so
      # there is one definition of the gate rather than two.
      - name: Smoke
        run: make smoke-player

      - name: Replay
        run: make replay-player

      - name: Sweep
        run: make sweep-player

  # Not configured and half configured are different things, and the job
  # treats them differently.
  #
  # With none of the three Google variables set, publishing simply is not
  # set up yet, so this job is skipped and main stays green. A red main on
  # every push would teach everyone to ignore the colour, which costs more
  # than the missing deploy.
  #
  # With some of them set, somebody meant to configure it and something is
  # wrong, so the job runs and the guard step below fails naming exactly
  # which variable is absent.
  publish:
    name: Publish
    needs: prove
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && (vars.GCP_PROJECT_ID != ''
          || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
          || vars.GCP_SERVICE_ACCOUNT != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://genlegend.eu
    env:
      # gen-legends, with an s. That is the service genlegend.eu maps to.
      # The default was gen-legend, which deploys successfully to a second
      # service nobody is looking at, so an automatic publish would have
      # reported success and changed nothing.
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'gen-legends' }}
      REGION: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}
    steps:
      - name: Take the code
        uses: actions/checkout@v4

      # Reached only when at least one variable is set, so anything missing
      # here is a half-finished setup rather than an absent one. Fail loudly
      # and early, rather than inside the cloud tool with a message nobody
      # can act on.
      - name: Check the Google settings are present
        run: |
          missing=""
          [ -n "${{ vars.GCP_PROJECT_ID }}" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "${{ vars.GCP_SERVICE_ACCOUNT }}" ] || missing="$missing GCP_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "Missing repository variables:$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Say who we are to Google
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Take the cloud tool
        uses: google-github-actions/setup-gcloud@v2

      # The same command the README documents, with the commit stamped on so
      # the running service can say which build it is.
      - name: Publish the container
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "BUILD_SHA=${GITHUB_SHA::7}" \
            --quiet

      - name: Say where it went
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --format 'value(status.url)'
